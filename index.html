<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم الوكلاء — الإدارة القانونية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--g:#0f5c4a;--g2:#e6efec;--bd:#dbe5e1;--tx:#1f2a27;--mu:#6b7c77;--am:#b45309;--rd:#b42318;--bg:#f4f7f6}
  *{box-sizing:border-box}
  body{margin:0;font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--tx);font-size:14.5px}
  header{background:var(--g);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;font-weight:700}
  header .sp{flex:1}
  header button{background:#ffffff22;color:#fff}
  header .pill{background:#ffffff22;color:#fff}
  main{max-width:1150px;margin:0 auto;padding:18px}
  .card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
  .center{max-width:420px;margin:60px auto}
  h2{font-size:17px;margin:0 0 12px;color:var(--g)}
  label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
  input,select,textarea{font-family:inherit;font-size:14px;padding:8px;border:1px solid #c9d6d2;border-radius:7px;width:100%;background:#fff}
  textarea{min-height:90px;line-height:1.7}
  button{font-family:inherit;background:var(--g);color:#fff;border:0;border-radius:7px;padding:8px 14px;font-size:14px;cursor:pointer}
  button.sec{background:var(--g2);color:var(--g)}
  button.am{background:var(--am)}
  button.rd{background:var(--rd)}
  button.sm{padding:5px 10px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--mu);font-size:12.5px}
  .err{color:var(--rd)}
  .tabs{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin-bottom:14px;flex-wrap:wrap}
  .tabs button{background:none;color:var(--mu);border-radius:8px 8px 0 0;padding:10px 16px;font-weight:600}
  .tabs button.on{background:#fff;color:var(--g);border:1px solid var(--bd);border-bottom:2px solid #fff;margin-bottom:-2px}
  .status{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;background:var(--g2);font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;background:#9ca3af}
  .nafath{background:#fffbeb;border:2px solid #f59e0b;border-radius:12px;padding:14px;text-align:center;margin-top:12px}
  .nafath b{font-size:44px;color:var(--am);display:block}
  .notice{border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
  .tmpl{background:#f8fbfa;border:1px dashed #b8cbc5;border-radius:8px;padding:10px;line-height:1.9;margin:6px 0;position:relative}
  .tmpl .cp{position:absolute;left:8px;top:8px}
  .rep{font-size:13px;margin-top:4px}
  .rep b{color:var(--g)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .stat{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:12px}
  .stat .n{font-size:26px;font-weight:700;color:var(--g)}
  .bar{height:10px;background:var(--g2);border-radius:6px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--g)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:right;vertical-align:top}
  th{background:#f1f6f4;color:var(--g);font-weight:600}
  .tag{font-size:11.5px;padding:2px 7px;border-radius:10px;background:var(--g2);color:var(--g);white-space:nowrap}
  .tag.auto{background:#e0e7ff;color:#3730a3}.tag.live{background:#fef3c7;color:#92400e}.tag.fu{background:#fce7f3;color:#9d174d}
  .toast{position:fixed;bottom:18px;left:18px;background:#1f2a27;color:#fff;padding:10px 16px;border-radius:8px;z-index:99;max-width:420px}
  .hidden{display:none!important}
  .logline{font-size:13px;padding:5px 0;border-bottom:1px solid #eef3f1}
  img.prev{max-height:70px;border:1px solid var(--bd);border-radius:6px;padding:4px;background:#fff}
  @media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0}}
</style>
</head>
<body>
<header>
  <h1>⚖️ لوحة تحكم الوكلاء — الإدارة القانونية</h1>
  <span class="sp"></span>
  <span id="hdrAgent" class="pill hidden"></span>
  <button id="btnSwitch" class="sm hidden">تبديل الوكيل</button>
  <button id="btnOut" class="sm hidden">خروج</button>
</header>
<main>
  <!-- تسجيل الدخول -->
  <section id="scLogin" class="card center hidden">
    <h2>تسجيل الدخول</h2>
    <label>البريد الإلكتروني</label><input id="lgEmail" type="email" autocomplete="username">
    <label>كلمة المرور</label><input id="lgPass" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:14px"><button id="lgBtn">دخول</button></div>
    <div id="lgErr" class="err" style="margin-top:8px"></div>
  </section>

  <!-- اختيار الوكيل -->
  <section id="scAgent" class="card center hidden">
    <h2>أدخل اسم الوكيل</h2>
    <input id="agName" type="password" autocomplete="off" spellcheck="false">
    <div class="row" style="margin-top:14px"><button id="agBtn">دخول للوكيل</button></div>
    <div id="agErr" class="err" style="margin-top:8px"></div>
  </section>

  <div id="agentHost" class="hidden"></div>
</main>
<div id="toast" class="toast hidden"></div>

function toast(t, ms = 3500) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hidden'), ms); }
function show(id) { for (const s of ['scLogin', 'scAgent', 'agentHost']) $(s).classList.toggle('hidden', s !== id); }
const tsDate = v => v ? (v.toDate ? v.toDate() : new Date(v)) : null;
const fmtDT = v => { const d = tsDate(v); return d ? d.toLocaleString('ar-SA-u-ca-gregory-nu-latn', { dateStyle: 'medium', timeStyle: 'short' }) : ''; };
const hijriToday = () => { const p = Object.fromEntries(new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', { day: '2-digit', month: '2-digit', year: 'numeric' }).formatToParts(new Date()).map(x => [x.type, x.value])); return `${p.day}-${p.month}-${String(p.year).replace(/\D/g, '')}`; };
const gregToday = () => { const d = new Date(); return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`; };
const gDisp = iso => { if (!iso) return ''; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}-${m}-${y}م`; };
const WD = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const wday = iso => iso ? WD[new Date(String(iso).slice(0, 10) + 'T12:00:00').getDay()] : '';
const tDisp = t => { if (!t) return ''; let [h, m] = String(t).split(':').map(Number); return `${String(h % 12 || 12).padStart(2, '0')}:${String(m).padStart(2, '0')} ${h >= 12 ? 'مساءً' : 'صباحاً'}`; };

// ===== المصادقة =====
const unsubs = [];
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch (e) {} } };
function stopAll() { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs.length = 0; }
onAuthStateChanged(auth, async user => {
  stopAll();
  $('btnOut').classList.toggle('hidden', !user);
  if (!user) { $('agentHost').innerHTML = ''; show('scLogin'); $('btnSwitch').classList.add('hidden'); $('hdrAgent').classList.add('hidden'); return; }
  if (user.uid !== OWNER_UID) { $('lgErr').textContent = 'هذا الحساب غير مصرّح له.'; await signOut(auth); return; }
  const last = ss.get('ak');
  if (!(last && await tryEnter(last))) showAgentPicker();
});
$('lgBtn').onclick = async () => {
  $('lgErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('lgEmail').value.trim(), $('lgPass').value); }
  catch (e) { $('lgErr').textContent = 'تعذر الدخول: تحقق من البريد وكلمة المرور.'; }
};
$('lgPass').onkeydown = e => { if (e.key === 'Enter') $('lgBtn').click(); };
$('btnOut').onclick = () => { ss.set('ak', ''); signOut(auth); };
$('btnSwitch').onclick = () => { ss.set('ak', ''); stopAll(); $('agentHost').innerHTML = ''; showAgentPicker(); };

function showAgentPicker() {
  show('scAgent'); $('btnSwitch').classList.add('hidden'); $('hdrAgent').classList.add('hidden');
  $('agName').value = ''; $('agName').focus();
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(name) {
  const raw = new TextEncoder().encode(norm(name));
  const base = await crypto.subtle.importKey('raw', raw, 'PBKDF2', false, ['deriveKey']);
  for (const m of ENC) {
    try {
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(m.s), iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(m.i) }, key, b64(m.c));
      return JSON.parse(new TextDecoder().decode(pt));
    } catch (e) {}
  }
  return null;
}
async function tryEnter(name) {
  const mod = await unlock(name);
  if (!mod) return false;
  ss.set('ak', name);
  stopAll();
  $('agentHost').innerHTML = mod.html;
  show('agentHost');
  $('hdrAgent').textContent = 'الوكيل: ' + mod.title; $('hdrAgent').classList.remove('hidden');
  $('btnSwitch').classList.remove('hidden');
  const ctx = { db, doc, getDoc, setDoc, addDoc, getDocs, collection, onSnapshot, query, where, orderBy, limit, serverTimestamp,
    $, esc, norm, toast, tsDate, fmtDT, hijriToday, gregToday, gDisp, WD, wday, tDisp, unsubs };
  const api = new Function('ctx', mod.js)(ctx);
  api.open();
  return true;
}
$('agBtn').onclick = async () => {
  const v = $('agName').value.trim();
  if (!v) return;
  $('agBtn').disabled = true; $('agErr').textContent = '';
  const ok = await tryEnter(v);
  $('agBtn').disabled = false;
  if (!ok) $('agErr').textContent = 'الاسم غير صحيح.';
};
$('agName').onkeydown = e => { if (e.key === 'Enter') $('agBtn').click(); };
</script>
